name: Build and deploy Vanguard Web

on:
  repository_dispatch:
    types: [build-vg-game]
  workflow_dispatch:
    inputs:
      source_ref:
        description: VG branch, tag, or commit to build
        required: false
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Vanguard source
        uses: actions/checkout@v4
        with:
          repository: RK0708/VG
          ref: ${{ github.event.client_payload.source_sha || inputs.source_ref || 'main' }}
          token: ${{ secrets.VG_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Prepare the minimal card art export copy
        run: python3 source/tools/prepare_web_export.py --source "$GITHUB_WORKSPACE/source" --destination "$RUNNER_TEMP/VG-web-project"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Cache Godot Web export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.6.3.stable
          key: godot-web-export-templates-4.6.3-v1

      - name: Download Godot 4.6.3 editor
        shell: bash
        run: |
          set -euo pipefail
          godot_dir="$RUNNER_TEMP/godot"
          mkdir -p "$godot_dir"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" \
            --output "$godot_dir/godot.zip"
          unzip -q "$godot_dir/godot.zip" -d "$godot_dir/editor"
          chmod +x "$godot_dir/editor/Godot_v4.6.3-stable_linux.x86_64"
          echo "GODOT_BIN=$godot_dir/editor/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Download Web templates on cache miss
        shell: bash
        run: |
          set -euo pipefail
          template_dir="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          if ! compgen -G "$template_dir/web_*" > /dev/null; then
            godot_dir="$RUNNER_TEMP/godot"
            mkdir -p "$template_dir"
            curl --fail --location --retry 3 \
              "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz" \
              --output "$godot_dir/templates.tpz"
            unzip -q -j "$godot_dir/templates.tpz" 'templates/web_*' -d "$template_dir"
          fi

      - name: Import resources and export the Web build
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/VG-web-project"
          "$GODOT_BIN" --headless --editor --path "$project" --import
          mkdir -p "$project/build/web"
          "$GODOT_BIN" --headless --path "$project" --export-release "Web" "$project/build/web/index.html"
          test -s "$project/build/web/index.html"
          site_bytes="$(du -sb "$project/build/web" | cut -f1)"
          if (( site_bytes > 1000000000 )); then
            echo "The exported site exceeds the GitHub Pages 1 GB limit."
            exit 1
          fi
          du -sh "$project/build/web"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/VG-web-project/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
